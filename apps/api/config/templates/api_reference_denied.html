<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>PixelVault developer reference</title>
    <style>
      /* Hallmark v2 · app screen · PixelVault · Read. */
      /* A small access gate carries no operation inventory or renderer assets. */
      :root{color-scheme:light dark;--canvas:#f8fafc;--ink:#0f172a;--muted:#52637b;--action:#0866ff;--on-action:#fff;--focus:#0866ff;--font:Manrope,system-ui,sans-serif}
      @media(prefers-color-scheme:dark){:root{--canvas:#0b1428;--ink:#f8fafc;--muted:#b3c0d5;--action:#76b0ff;--on-action:#0b1428;--focus:#76b0ff}}
      html,body{overflow-x:clip}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font)}main{max-width:28rem;margin:14dvh auto;padding:24px}h1{margin-top:40px;font-size:28px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:break-word;min-width:0}p{font-size:16px;line-height:1.65;color:var(--muted)}.brand{font-size:20px;font-weight:800}.brand span{color:var(--action)}a{display:inline-flex;align-items:center;min-height:44px;margin-top:20px;padding:0 18px;border-radius:10px;background:var(--action);color:var(--on-action);font-size:14px;font-weight:700;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    </style>
  </head>
  <body><main><div class="brand">Pixel<span>Vault</span></div><h1>Staff sign-in required.</h1><p>The developer reference is available to active developer and administrator staff.</p><p>Sign in with your authorized account to read the API contracts and guides.</p><a href="{{ sign_in_url }}">Sign in to PixelVault</a></main></body>
</html>
