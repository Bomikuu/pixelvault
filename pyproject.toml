[project]
name = "pixelvault"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.6,<6",
    "httpx>=0.28,<1",
    "python-dotenv>=1",
    "drf-spectacular>=0.28,<1",
    "reportlab>=4.4,<5",
    "cryptography>=45",
    "gunicorn>=23",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.11", "pytest-httpx>=0.35", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["apps/api"]
testpaths = ["apps/api"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
exclude = ["**/migrations/**", "**/vendor_sdk/**"]
