                type: string
                format: date
              principal_collected:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              interest_collected:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              confirmed_collections:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              collection_reversals:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              net_collections:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              collection_count:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              principal_disbursed:
                type: string
                pattern: ^-?[0-9]+$
                description: Exact PHP centavos serialized as a decimal integer string.
              interest_accrued:
                type: string
                pattern: ^-?[0-9]+$
