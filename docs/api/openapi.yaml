components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
  schemas:
    DomainError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      example:
        code: stale_revision
        message: Refresh this record before continuing.
    DetailError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    FieldErrors:
      type: object
      additionalProperties:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
        - type: object
          additionalProperties: {}
          description: Domain metadata; inspect the owning operation's description.
            These fields are not fully typed.
      description: DRF field errors. This deliberately retains the existing error
        format.
    Recorded:
      type: object
      properties:
        recorded:
          type: boolean
      required:
      - recorded
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        display_name:
          type: string
