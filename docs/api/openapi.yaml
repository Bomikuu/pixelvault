        bubble:
          allOf:
          - $ref: '#/components/schemas/PlazaBubble'
          nullable: true
      required:
      - participant_id
      - person
      - trajectory
      - bubble
    PlazaSnapshot:
      type: object
      properties:
        room:
          $ref: '#/components/schemas/PlazaRoom'
        revision:
          type: string
        server_time_ms:
          type: number
        self:
          type: object
          properties:
            participant_id:
              type: string
              format: uuid
            owned:
              type: boolean
            sequence:
              type: integer
          required:
          - participant_id
          - owned
          - sequence
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PlazaParticipant'
          maxItems: 40
        offers:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryOffer'
        own_offers:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryOffer'
        offers_next_cursor:
          type: string
          nullable: true
      required:
      - room
      - revision
      - server_time_ms
      - self
      - participants
      - offers
      - own_offers
      - offers_next_cursor
    PlazaCommand:
      oneOf:
      - type: object
        properties:
          instance_id:
            type: string
            format: uuid
          lease:
            type: string
            maxLength: 128
          action:
            type: string
            enum:
            - heartbeat
        required:
        - instance_id
        - lease
        - action
      - type: object
        properties:
          instance_id:
            type: string
            format: uuid
          lease:
            type: string
            maxLength: 128
          action:
            type: string
            enum:
            - move
          sequence:
            type: integer
            minimum: 1
            maximum: 2147483647
          target:
            $ref: '#/components/schemas/PlazaPoint'
        required:
        - instance_id
        - lease
        - action
        - sequence
        - target
      - type: object
        properties:
          instance_id:
            type: string
            format: uuid
          lease:
            type: string
            maxLength: 128
          action:
            type: string
            enum:
            - stop
          sequence:
            type: integer
        required:
        - instance_id
        - lease
        - action
        - sequence
      - type: object
        properties:
          instance_id:
            type: string
            format: uuid
          lease:
            type: string
            maxLength: 128
          action:
            type: string
            enum:
            - bubble
          body:
            type: string
            maxLength: 120
          operation_id:
            type: string
            format: uuid
          offer_id:
            type: string
            format: uuid
            nullable: true
        required:
        - instance_id
        - lease
        - action
        - body
        - operation_id
      - type: object
        properties:
          instance_id:
            type: string
            format: uuid
          lease:
            type: string
            maxLength: 128
          action:
            type: string
            enum:
            - clear_bubble
        required:
        - instance_id
        - lease
        - action
      - type: object
        properties:
          instance_id:
            type: string
            format: uuid
          lease:
            type: string
            maxLength: 128
          action:
            type: string
            enum:
            - leave
        required:
        - instance_id
        - lease
        - action
    PlazaCommandResult:
      type: object
      properties:
        recorded:
          type: boolean
        trajectory:
          $ref: '#/components/schemas/PlazaTrajectory'
        server_time_ms:
          type: number
      required:
      - recorded
    PlazaModeration:
      type: object
      properties:
        id:
          type: string
