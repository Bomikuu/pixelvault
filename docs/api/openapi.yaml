openapi: 3.0.3
info:
  title: PixelVault API
  version: 0.1.0
  description: |
    # Build with PixelVault

    Private developer reference. Use synthetic records in test mode. Live origination and payout routing remain disabled. Viewing these docs grants no permission to invoke staff or financial operations.

    Search an operation, inspect its request/response, or follow the guides below. The request playground is intentionally disabled.

    **Contract coverage:** source-reviewed domain declarations describe requests and responses. Runtime projection and permission checks remain a separate release gate.

    ---

    ## Browser sessions and first request

    Both web and phone/PWA use same-origin `/api/v1` with the same accounts. Start with `GET /api/v1/auth/session`; a guest receives `member: null`, an environment and a CSRF token. Keep the token in memory. Session cookies stay HttpOnly. `POST /auth/sign-in` rotates the session and CSRF token; use the returned/current bootstrap token for subsequent writes. Never put credentials into query strings, logs, generated examples or persistent frontend storage.

    ```js
    const bootstrap = await fetch('/api/v1/auth/session', {
      credentials: 'same-origin', cache: 'no-store'
    }).then(response => response.json());
    // Sign in explicitly with user-entered values. Do not embed credentials.
    const response = await fetch('/api/v1/auth/sign-in', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': bootstrap.csrf_token},
      body: JSON.stringify({email: enteredEmail, password: enteredPassword})
    });
    if (!response.ok) throw new Error('Sign-in was not accepted');
    const session = await response.json();
    ```

    For cURL use a local cookie jar and a locally extracted current token; placeholders below deliberately do not contain reusable credentials:

    ```sh
    curl --cookie-jar session.cookies https://YOUR_HOST/api/v1/auth/session
    curl --cookie session.cookies --cookie-jar session.cookies \
      --header 'Content-Type: application/json' \
      --header 'X-CSRFToken: CURRENT_BOOTSTRAP_TOKEN' \
      --data @local-user-entered-sign-in.json https://YOUR_HOST/api/v1/auth/sign-in
    ```

    Python clients use a persistent cookie jar and the same CSRF protocol:

    ```python
    import requests
    session = requests.Session()
    bootstrap = session.get(f'{origin}/api/v1/auth/session').json()
    result = session.post(f'{origin}/api/v1/auth/sign-in',
        headers={'X-CSRFToken': bootstrap['csrf_token']},
        json={'email': entered_email, 'password': entered_password})
    result.raise_for_status()
    csrf = result.json()['csrf_token']
    ```

    Sign-out clears the server session and client private cache. Expiry, account switches and app resume must refetch identity before displaying private records; reject old in-flight responses. Public contact submission is not verified email ownership. Recovery-email challenges and password-reset links are single-use, time-bounded, explicit POSTs; the link token belongs in the URL fragment and is removed from the displayed URL. No bearer/API-key login is provided by these routes.


    ---

    ## Money, dates, errors and retries

    PHP money is exact integer **centavos**: `800000` means ₱8,000.00. Aggregate investment/reporting amounts can be signed decimal **strings**; format with integer arithmetic. Rates and investment shares use basis points: `900` is 9%, `2000` is 20%. Never send a floating-point peso amount. Instants use ISO-8601 offsets/UTC; display meetings in Asia/Manila. Loan due dates are calendar dates, not UTC midnight instants.

    Principal, collected interest, accrued interest, contractual future interest, platform fees, reversals, losses and lender settlement are different facts. A checkout, receipt image or collection does not establish lender settlement. Unknown settlement must stay unknown. Calculator results are estimates and never amend a submitted application or frozen agreement.

    The existing error formats remain: domain `{code, message}`, framework `{detail}`, or field errors such as `{principal: ["…"]}`. Handle 400 validation, 401 invalid sign-in, 403 access/CSRF/step-up, 404 missing-or-inaccessible, 409 stale hash/version/state, 429 throttling, network failure and provider unavailability separately. A 404 is not evidence that a private object never existed.

    Many financial POSTs require a UUID `operation_id`; others require `expected_revision`, `expected_offer_version`, `expected_version` or `expected_hash` as documented. There is no universal idempotency header. An exact retry keeps both the original operation ID and exact body. Never reuse an ID with changed terms. An uncertain network/5xx result needs a fresh authoritative record before offering a deliberate retry; do not automatically retry or queue financial writes offline. Endpoints without operation IDs need endpoint-specific reconciliation.


    ---

    ## Synthetic loan lifecycle

    Use two eligible synthetic accounts, with current contact/identity/income checks and the required lender evidence. Their presence in a demonstration does not authorize live lending.

    1. Discover published offers through `GET /community/discovery`; page with the returned cursor. Only approximate public areas are exposed. Member-only `GET /offers/{offer_id}` supplies current terms and permitted application data.
    2. Inspect `GET /engagement/offers/{offer_id}/calculator?principal=800000&frequency=monthly&installment_count=3`. The server supplies a reducing-balance disclosure. Variant plans are simulations; applications use the lender's original terms.
    3. Borrower explicitly posts `/offers/{offer_id}/applications` with principal, purpose and operation ID. An optional co-borrower invitation must already be accepted and ready. This grants no document access and creates no joint liability by itself.
    4. Create the borrowing meeting with offer/application IDs, agree on a schedule, check in, and review proposal/evidence. The lender's preparation selects the application and reserves capacity using current server state. A stale reservation/version returns a conflict.
    5. Each person reviews the full frozen agreement and its PDF/hash. Their individual `accept_contract` commands accept that same version. Proposal approvals and chat messages are separate from acceptance.
    6. Use the shared loan record to inspect funding status. Disbursement is a separate lender action, with eligibility/date/acceptance/fee policy rechecks. No UI navigation funds a loan.
    7. The borrower reads `/loans/{loan_id}/payment-preview` and explicitly requests `/loans/{loan_id}/checkout`. Only signed provider events and server reconciliation establish collection. Current accrued payoff differs from a schedule containing future interest.
    8. Read servicing timeline, payments, private documents and receipts. Commission accrual/collection and lender settlement remain distinct. If a date/contract must change, use the versioned renewal process and both parties' new acceptance rather than editing a signed row.

    Paths above are relative to `/api/v1`. Each endpoint's ownership and policy are checked independently; document access to this reference is not application authorization.


    ---

    ## Mutual rooms and simulated investment

    Create an investment room with `kind: "investment"`, `offer_id`, integer-centavo `amount`, `share_bps` from 0 to 10000 and a UUID operation ID. The minimum proposed contribution is 10000 centavos. Borrowing rooms instead include `application_id`. Creation is a pitch, not an investment acceptance.

    The lender proposes a timezone-aware schedule. Both people accept the current schedule version, then explicitly check in within one hour either side of that time. Lobby activity, room attendance and optional public profile activity are separate. Ping is a private in-app reminder with a 60-second cooldown. Opening a record must not check in, capture media, upload evidence or execute financial commands.

    Every room command has `action` and `operation_id`. All except heartbeat, lobby_heartbeat, leave, ping, message and counter need the current `expected_revision`. Lender-only schedule/agenda/propose/prepare actions do not authorize the other participant. Messages/counters can suggest changes; only a new proposal changes negotiated terms.

    - `approve` uses `expected_hash: proposal_hash`, current mutual attendance and the current proposal.
    - `review_evidence` uses `expected_hash: evidence_hash`. A scan or acknowledgment never certifies authenticity.
    - `prepare` freezes a contract after both proposal approvals and evidence acknowledgments.
    - `accept_contract` needs `accepted: true`, mutual attendance and the frozen agreement hash. Each person accepts separately.
    - `confirm_test_funding` needs `confirmed_simulation: true`, that same investment hash, accepted terms, current eligibility and both present. Only both funding acknowledgments increase the simulated pot.

    The investor receives a negotiated share of **interest actually collected from loans allocated to their contribution**, excluding principal, late fees and uncollected interest. They bear allocated losses. The separate **2% lender-paid demonstration fee** is test policy, added separately so the contribution enters the pot in full; it is not an approved live tariff. FIFO allocation and subsequent collections/reversals/losses drive the private position.

    Payout preparation, participant receipt confirmation and cancellation are distinct commands referencing a current payout ID. A prepared payout is not received money. There are no real investment transfers or withdrawable balances in this implementation. Public contributor circles contain at most five unique people, preserve anonymity and never reveal individual positions or amounts.


    ---

    ## Events, pagination and private files

    Room SSE is participant-only, lasts about 45 seconds and advertises `retry: 3000`. `room.changed` provides sequence/revision; `room.expired` ends an expired session. Refetch the authorized room snapshot after a change. Do not assume replay of every missed event. Public activity SSE sends `ready` and `offers.changed` revisions, never borrower/payment/document activity. Foreground REST polling is the native baseline until cookie/event transport is proven. Pause requests and stop local media in the background.

    Use each endpoint's returned cursor; there is no global pagination format. Discovery uses a bounded offset cursor (30 rows per page, from the latest 1000 supported offers). Leaderboard uses signed snapshot cursors that can conflict or expire, requiring a fresh first page. Threads/social comments use their own bounded offset cursors. Keep loaded counts distinct from global totals. New messages should preserve the reader's scroll and focus.

    Evidence upload uses multipart form data and leaves the browser to set the boundary. Private documents accept nonempty PDF/PNG/JPEG, up to 10 MiB, inspect magic bytes and start quarantined. Room evidence additionally requires `consent: "share_with_counterparty"` and a supported category. Profile photos are a separate sanitized, nonanimated JPEG/PNG/WebP upload of at most 3 MiB, not identity evidence.

    `GET /documents/{id}/download` issues an actor-bound link lasting 60 seconds. Content rechecks the actor, clean state and permission; a token alone is insufficient. PDF agreements, text investment contracts, JPEG profile photos and dates-only calendar ICS use distinct MIME types and filenames. Respect Content-Disposition (including filename*=UTF-8), private/no-store and revocation. Never cache private files, grants, API responses or authenticated HTML in the PWA service worker. An image of a transfer is not a settled payment.


    ---

    ## Native compatibility gate

    The separate React/TypeScript phone interface shares Django APIs, domain contracts, art and canonical controls with web. Browser/PWA runs at `/m/`; full analytics/admin/reference remain web surfaces. Capacitor configuration is source preparation, not a verified Android application.

    Native authenticated transport currently fails closed. Before enabling it, prove session-cookie ownership, CSRF bootstrap/rotation, restart/expiry/sign-out/revocation, rejected invalid-CSRF writes, multipart uploads and actor-authorized binary downloads on a physical Android device. Do not weaken cookie flags, CORS or CSRF to make a WebView request succeed. No refresh token, bearer-login endpoint, base64 file bridge or insecure native API origin is implied.

    Approved return links only navigate to allowlisted PixelVault records and refetch server state; they cannot accept a contract or assert collection/settlement. App Links require deployment verification. Native calls stay hidden pending device permission/network validation. Background calls, store publication and iOS are separate gates.

    The PWA caches only a public static shell and selected bundled assets, never financial data or queued mutations. Its update prompt requires an explicit reload; native mode does not register this worker. Keep offline records unavailable until a new online session refresh.


    ---

    # Shared city marketplace

    `GET /plaza/rooms` exposes stable city-room metadata and unexpired aggregate counts. Explicit `POST /plaza/rooms/{slug}/join` needs an active unsuspended member, CSRF, an instance UUID and operation UUID. It returns the owner's private lease and a current bounded snapshot. Leases remain in memory; never send them in URLs, logs or public projections.

    There is one controlled character per account and forty places per room. A deliberate join from another tab replaces control. Repeating an exact join operation only returns its still-current lease; it cannot take control back from a replacement. Reusing an operation UUID with different parameters conflicts. Join failure due to capacity leaves the previous room intact.

    Commands require the authenticated owner session, instance and lease. Move/stop commands carry a monotonic sequence; the server computes positions/trajectories with a fixed speed and Redis server time. Heartbeat every fifteen foreground seconds; leases expire after sixty seconds. Coordinates are virtual game positions, not device location or proof of residence. Stale lease/sequence responses must be reconciled rather than automatically replayed.

    The `X-Plaza-Instance` header is a nonsecret UUID allowing a REST snapshot to indicate control ownership. It grants no access by itself. `GET /plaza/rooms/{slug}/stream` uses the browser session and current room, not a query token. A forty-five-second stream emits `plaza.changed` with a revision and `plaza.expired` when membership becomes unavailable; fetch a fresh authorized snapshot after changes/reconnect. Heartbeat comments and retry hints do not promise full replay.

    Bubble text is plain Unicode, at most120 code points after trimming and newline normalization. One visible bubble/person, sixty seconds, six posts/minute. Posting uses an operation UUID with exact payload on an explicit retry; there is no offline queue or automatic repost. An optional attached offer must belong to the actor and be currently published/available in the same city. Its current server terms/calculator, not bubble free text, determine cost and interest basis. Reading a bubble/modal does not reserve funds or create a loan.

    Only current joined members receive participant/bubble snapshots. These expose the established public identity/achievement projection, not contacts, income evidence, private history or other leases. Guest counts are not permission to access those snapshots. Presence, public profile activity preference and financial eligibility remain distinct facts.

    Room-visible bubbles can be reported. Expired evidence remains available to authorized moderator/admin staff, not the public feed; decisions require a current version and reason and are audited. Self-moderation is refused. The test retention task deletes expired content after seven days unless an unresolved report needs it; production policy/staffing remains a release gate. Reference access does not grant moderation permission.

    All API paths above are under `/api/v1`. Room/storage/provider availability and loan/financial settlement are independent. See `docs/marketplace/development.md` and the release checklist for current source/visual evidence and pending checks.
  x-contract-note: Only operations marked typed have explicit source-reviewed contracts.
    Partial operations remain visible and require source review.
