            interest:
              type: string
              pattern: ^-?[0-9]+$
              description: Exact PHP centavos serialized as a decimal integer string.
            other_charges:
              type: string
              pattern: ^-?[0-9]+$
              description: Exact PHP centavos serialized as a decimal integer string.
            total:
