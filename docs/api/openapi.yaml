    PlazaPoint:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1000
        y:
          type: number
          minimum: 0
          maximum: 700
      required:
      - x
      - y
    PlazaTrajectory:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/PlazaPoint'
        target:
          $ref: '#/components/schemas/PlazaPoint'
        started_at_ms:
          type: number
        duration_ms:
          type: number
        sequence:
          type: integer
      required:
      - start
      - target
      - started_at_ms
      - duration_ms
      - sequence
    PlazaRoom:
      type: object
      properties:
        slug:
          type: string
