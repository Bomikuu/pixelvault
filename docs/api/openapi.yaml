      x-code-samples:
      - lang: javascript
        label: Browser session / CSRF
        source: |-
          // Replace path placeholders with records this account may access.
          // Complete browser sign-in first; never set or paste the HttpOnly session cookie.
          // Operation path: /api/v1/admin/achievement-holds/{hold_id}/resolve
          async function requestPixelVault(path, reviewedPayload) {
            const session = await fetch('/api/v1/auth/session', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.json());
            const response = await fetch(path, {method: 'POST', credentials: 'same-origin', cache: 'no-store',
              headers: { 'X-CSRFToken': session.csrf_token, 'Content-Type': 'application/json' },
              body: JSON.stringify(reviewedPayload)});
            if (!response.ok) throw await response.json();
            return response.json();
          }
          // Call only after filling the operation's schema and reviewing the current record.
          // No automatic mutation retries or offline queue.
      - lang: bash
        label: cURL cookie jar
        source: |-
          # Use a local cookie jar from the documented sign-in flow. Replace placeholders.
          curl --request POST --cookie session.cookies 'https://YOUR_HOST/api/v1/admin/achievement-holds/{hold_id}/resolve' \
            --header 'Origin: https://YOUR_HOST' \
            --header 'X-CSRFToken: CURRENT_CSRF_TOKEN' \
            --header 'Content-Type: application/json' \
            --data @reviewed-payload.json
      - lang: python
        label: Python session
        source: |-
          # session is an authenticated requests.Session from the browser-sessions guide.
          # Replace path placeholders; keep credentials out of source and logs.
          path = '/api/v1/admin/achievement-holds/{hold_id}/resolve'
          bootstrap = session.get(origin + '/api/v1/auth/session').json()
          headers = {'X-CSRFToken': bootstrap['csrf_token'], 'Origin': origin}
          response = session.request('POST', origin + path, headers=headers, json=reviewed_payload)
          response.raise_for_status()
          result = response.json()
