services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixelvault
      POSTGRES_USER: pixelvault
      POSTGRES_PASSWORD: pixelvault
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - pixelvault_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelvault"]
      interval: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56438:6379"
volumes:
  pixelvault_postgres:
